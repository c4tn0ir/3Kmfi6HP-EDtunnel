name: NoirVPN toolchain export

on:
  push:
    branches:
      - noirvpn-toolchain-20260928
    paths:
      - ".github/workflows/noirvpn-toolchain-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          mkdir -p "$RUNNER_TEMP/sdk-out"
          tar -C "$ANDROID_HOME" -czf "$RUNNER_TEMP/sdk-out/android-sdk-36-bt36.tar.gz" \
            platforms/android-36 \
            build-tools/36.0.0 \
            platform-tools \
            licenses
          sha256sum "$RUNNER_TEMP/sdk-out/android-sdk-36-bt36.tar.gz" > "$RUNNER_TEMP/sdk-out/android-sdk-36-bt36.tar.gz.sha256"

      - name: Download Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o "$RUNNER_TEMP/gradle-8.13-bin.zip" \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle-8.13-bin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP/gradle-dist"

      - name: Warm NoirVPN dependency cache
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noir-cache-project"
          mkdir -p "$ROOT/app/src/main/java/com/example/cache" "$ROOT/app/src/main/res/values" "$ROOT/gradle-home"
          cat > "$ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NoirCache"
          include(":app")
          EOF
          cat > "$ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.13.2" apply false
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          EOF
          cat > "$ROOT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF
          cat > "$ROOT/app/build.gradle.kts" <<'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.cache"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.example.cache"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1"
              }
              buildFeatures { compose = true; buildConfig = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlin { compilerOptions { jvmTarget.set(JvmTarget.JVM_17) } }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2026.06.01"))
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.10.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")
              debugImplementation("androidx.compose.ui:ui-tooling")
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.json:json:20260814")
          }
          EOF
          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme"/>
          </manifest>
          EOF
          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/>
          </resources>
          EOF
          cat > "$ROOT/app/src/main/java/com/example/cache/MainActivity.kt" <<'EOF'
          package com.example.cache
          import android.app.Activity
          class MainActivity : Activity()
          EOF
          "$RUNNER_TEMP/gradle-dist/gradle-8.13/bin/gradle" \
            -p "$ROOT" \
            -g "$ROOT/gradle-home" \
            --no-daemon \
            :app:assembleDebug
          mkdir -p "$RUNNER_TEMP/gradle-cache-out"
          tar -C "$ROOT/gradle-home" -czf "$RUNNER_TEMP/gradle-cache-out/noir-gradle-home.tar.gz" caches
          sha256sum "$RUNNER_TEMP/gradle-cache-out/noir-gradle-home.tar.gz" > "$RUNNER_TEMP/gradle-cache-out/noir-gradle-home.tar.gz.sha256"

      - name: Package JDK 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jdk-out"
          tar -C "$JAVA_HOME" -czf "$RUNNER_TEMP/jdk-out/temurin-jdk17.tar.gz" .
          sha256sum "$RUNNER_TEMP/jdk-out/temurin-jdk17.tar.gz" > "$RUNNER_TEMP/jdk-out/temurin-jdk17.tar.gz.sha256"

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: noir-android-sdk36-bt36
          path: ${{ runner.temp }}/sdk-out/
          retention-days: 3
          compression-level: 0

      - name: Upload Gradle 8.13
        uses: actions/upload-artifact@v4
        with:
          name: noir-gradle-8.13
          path: ${{ runner.temp }}/gradle-8.13-bin.zip
          retention-days: 3
          compression-level: 0

      - name: Upload dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: noir-gradle-cache
          path: ${{ runner.temp }}/gradle-cache-out/
          retention-days: 3
          compression-level: 0

      - name: Upload JDK 17
        uses: actions/upload-artifact@v4
        with:
          name: noir-jdk17
          path: ${{ runner.temp }}/jdk-out/
          retention-days: 3
          compression-level: 0