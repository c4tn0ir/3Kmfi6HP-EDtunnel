name: Build NoirVPN Clean

on:
  push:
    branches: [noirvpn-clean-dev]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: r29
      LIBXRAY_COMMIT: 83f16029d38791274c40fa061958daf9ccd85bb7
      SOURCE_SHA256: c49ea528b448dd0d5c9a2d0a792264978332d0c8c04291dd2710d9f3f10dba5a
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct clean source
        run: |
          cat ci/noirvpn-source.b64.00 ci/noirvpn-source.b64.01a ci/noirvpn-source.b64.01b ci/noirvpn-source.b64.02 ci/noirvpn-source.b64.03 ci/noirvpn-source.b64.04 | base64 -d > /tmp/noirvpn-source.tgz
          echo "$SOURCE_SHA256  /tmp/noirvpn-source.tgz" | sha256sum -c -
          mkdir -p noirvpn
          tar -xzf /tmp/noirvpn-source.tgz -C noirvpn
          cp ci/overrides/build.gradle.kts noirvpn/build.gradle.kts
          cp ci/overrides/app-build.gradle.kts noirvpn/app/build.gradle.kts
          cp ci/overrides/gradle.properties noirvpn/gradle.properties

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: noirvpn-clean-source
          path: noirvpn/
          if-no-files-found: error

      - name: Guard source identity
        working-directory: noirvpn
        run: python3 scripts/identity_guard.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 4 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o /tmp/cmdline-tools.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/cmdline-tools.zip" | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Fetch official libXray v26.9.9
        run: |
          curl -fL --retry 4 \
            https://github.com/XTLS/libXray/releases/download/v26.9.9/libxray-android.zip \
            -o /tmp/libxray-android.zip
          echo "4998a8b56e4a78a164b5359d5690036f83da3b575465cea57ddf29c0149c345f  /tmp/libxray-android.zip" | sha256sum -c -
          unzip -q /tmp/libxray-android.zip -d /tmp/libxray
          AAR="$(find /tmp/libxray -type f -iname '*.aar' -print -quit)"
          test -n "$AAR"
          echo "Using libXray AAR: $AAR"
          mkdir -p "$GITHUB_WORKSPACE/noirvpn/app/libs"
          cp "$AAR" "$GITHUB_WORKSPACE/noirvpn/app/libs/libXray.aar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APKs
        working-directory: noirvpn
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug

      - name: Guard APK identity
        working-directory: noirvpn
        run: python3 scripts/identity_guard.py app/build/outputs/apk

      - name: Collect
        run: |
          mkdir -p dist
          cp noirvpn/app/build/outputs/apk/release/app-release-unsigned.apk dist/NoirVPN-clean-release-unsigned.apk
          cp noirvpn/app/build/outputs/apk/debug/app-debug.apk dist/NoirVPN-clean-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: noirvpn-clean-apks
          path: dist/
          if-no-files-found: error
