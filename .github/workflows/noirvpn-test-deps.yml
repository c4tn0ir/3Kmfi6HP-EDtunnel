name: NoirVPN test deps export

on:
  push:
    branches:
      - noirvpn-toolchain-20260928
    paths:
      - ".github/workflows/noirvpn-test-deps.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-deps"
          curl -fL --retry 5 -o "$RUNNER_TEMP/test-deps/junit-4.13.2.jar" https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fL --retry 5 -o "$RUNNER_TEMP/test-deps/hamcrest-core-1.3.jar" https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          curl -fL --retry 5 -o "$RUNNER_TEMP/test-deps/json-20260814.jar" https://repo1.maven.org/maven2/org/json/json/20260814/json-20260814.jar
          sha256sum "$RUNNER_TEMP/test-deps/"*.jar | tee "$RUNNER_TEMP/test-deps/SHA256SUMS.txt"

      - name: Upload test dependencies
        uses: actions/upload-artifact@v4
        with:
          name: noir-test-deps
          path: ${{ runner.temp }}/test-deps/
          retention-days: 3
          compression-level: 0